<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Gift Exchange</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 50 C12 34 20 20 34 12 C42 7 52 6 56 12 C50 10 46 14 48 20 C40 24 44 38 54 50 Z' fill='%232e9e4f'/%3E%3Cpath d='M14 38 C18 28 24 20 32 15' stroke='%235fd18a' stroke-width='3' fill='none' stroke-linecap='round' opacity='.7'/%3E%3Cpath d='M4 47 Q30 40 58 47 L58 57 Q30 50 4 57 Z' fill='%23fff' stroke='%23d9d9d9' stroke-width='1.5'/%3E%3Ccircle cx='56' cy='13' r='6' fill='%23f5c542' stroke='%23c99a1a' stroke-width='1.5'/%3E%3Ccircle cx='56' cy='15' r='1.6' fill='%238a6a10'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fbf5ec;
    --panel: #fff;
    --ink: #2b2140;
    --muted: #7a7090;
    --line: #eadfce;
    --red: #d94848;
    --red-dark: #b33434;
    --green: #2f9e62;
    --blue: #3aa0ff;
    --soft: #f6f1fb;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  header { text-align: center; padding: 22px 16px 6px; }
  header h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.6rem); }
  header h1 .a { color: var(--red); }
  header h1 .b { color: var(--green); }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  @media (max-width: 640px) { main { padding: 12px 16px 40px; } }

  .panel {
    background: var(--panel);
    border-radius: var(--radius);
    box-shadow: 0 4px 20px rgba(43, 33, 64, 0.08);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .panel h2 { margin: 0; font-size: 1.2rem; }
  .hint { margin: 0; font-size: 0.85rem; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > input[type=text] { flex: 1; min-width: 140px; }

  input[type=text], input[type=url] {
    font: inherit;
    font-size: 1rem;
    padding: 10px 12px;
    border: 2px solid var(--line);
    border-radius: 10px;
    outline: none;
    background: #fff;
    color: var(--ink);
    min-width: 0;
  }
  input:focus { border-color: var(--blue); }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; font-weight: bold; }
  label.field span.opt { font-weight: normal; color: var(--muted); }

  .btn {
    font: inherit;
    font-size: 0.95rem;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    background: var(--green);
    color: #fff;
    font-weight: bold;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.06); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.red { background: var(--red); }
  .btn.secondary { background: var(--soft); color: var(--ink); font-weight: normal; }
  .btn.small { padding: 6px 10px; font-size: 0.85rem; }

  .share {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .share code {
    flex: 1; min-width: 0;
    background: var(--soft);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 0.9rem;
    overflow-wrap: anywhere;
  }

  .items-editor { display: flex; flex-direction: column; gap: 8px; }
  .item-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
  @media (max-width: 640px) {
    .item-row { grid-template-columns: 1fr auto; }
    .item-row input[type=url] { grid-column: 1 / -1; order: 1; }
  }
  .icon-btn {
    border: none; background: transparent; color: var(--muted);
    font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 8px;
  }
  .icon-btn:hover { background: #f8e6e6; color: var(--red-dark); }

  .people {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border-radius: var(--radius);
    box-shadow: 0 4px 20px rgba(43, 33, 64, 0.08);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 6px solid var(--card-color, var(--red));
    scroll-margin-top: 16px;
  }
  .card.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 6px var(--blue); } 100% { box-shadow: 0 4px 20px rgba(43,33,64,0.08); } }
  .card h3 { margin: 0; font-size: 1.25rem; overflow-wrap: anywhere; flex: 1; min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .avatar {
    flex: none;
    width: var(--size, 52px); height: var(--size, 52px);
    border-radius: 50%;
    object-fit: cover;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-weight: bold; font-size: calc(var(--size, 52px) * 0.42);
    border: 3px solid #fff;
    box-shadow: 0 0 0 2px var(--card-color, var(--line));
    background: var(--card-color, var(--muted));
    vertical-align: middle;
  }
  .avatar.small { --size: 28px; border-width: 2px; box-shadow: none; }
  .photo-picker { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .photo-picker input[type=file] { display: none; }
  select {
    font: inherit; font-size: 0.95rem; padding: 8px 10px;
    border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
    min-width: 0; flex: 1;
  }
  .fixed-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .fixed-list li {
    display: flex; align-items: center; gap: 8px;
    background: var(--soft); border-radius: 10px; padding: 6px 6px 6px 10px; overflow-wrap: anywhere;
  }
  .fixed-list li span { flex: 1; }
  .tag {
    display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px;
    background: var(--soft); color: var(--muted); margin-left: 6px; vertical-align: middle;
  }
  .card ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
  .card li { overflow-wrap: anywhere; }
  .card a { color: var(--blue); }
  .card .none { color: var(--muted); font-style: italic; }
  .buying {
    background: #eef8f2; color: #1e6b41; border-radius: 10px; padding: 8px 10px; font-size: 0.95rem;
  }
  .buying a { color: inherit; font-weight: bold; }
  .card .actions { display: flex; gap: 8px; margin-top: auto; }

  .pairs { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
  .pairs li {
    background: var(--soft); border-radius: 10px; padding: 8px 10px; overflow-wrap: anywhere;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }

  .banner { border-radius: 12px; padding: 12px 14px; background: #fff4d6; color: #7a5b00; }
  .banner.error { background: #fde8e8; color: var(--red-dark); }
  .empty { color: var(--muted); font-style: italic; text-align: center; padding: 24px 0; }
  .center { text-align: center; }
  .groups { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .groups a { color: var(--blue); }

  .elf-scene {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    padding: 28px 12px 18px;
    background:
      radial-gradient(2px 2px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 8%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 48% 22%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 66% 12%, #fff 50%, transparent 51%),
      radial-gradient(2.5px 2.5px at 82% 26%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 92% 6%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 6% 40%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 58% 38%, #fff 50%, transparent 51%),
      linear-gradient(180deg, #2a2f6e 0%, #4b56a8 55%, #8c97d6 100%);
  }
  .elf-scene::after {
    content: "";
    position: absolute; left: -10%; right: -10%; bottom: -60px; height: 140px;
    background: #f4f8ff;
    border-radius: 50% 50% 0 0;
    z-index: 0;
  }
  .elf-scene h2 { color: #fff; text-align: center; margin: 0 0 8px; position: relative; z-index: 1; }
  .elves {
    position: relative; z-index: 1;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px;
  }
  .elf {
    width: 112px;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer; background: none; border: none; padding: 0; font: inherit;
  }
  .elf { padding-top: 14px; }
  .elf svg { width: 112px; height: 187px; overflow: visible; }
  .elf .dancer { animation: elf-dance 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
  .elf:nth-child(even) .dancer { animation-direction: reverse; }
  .elf .elf-name {
    margin-top: -4px;
    background: rgba(255,255,255,0.92); color: var(--ink);
    border-radius: 999px; padding: 2px 10px; font-size: 0.85rem; font-weight: bold;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  @keyframes elf-dance {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    25% { transform: translateY(-8px) rotate(0deg); }
    50% { transform: translateY(0) rotate(4deg); }
    75% { transform: translateY(-5px) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) { .elf .dancer { animation: none; } }

  .crop-card { gap: 14px; }
  .crop-canvas {
    width: var(--crop-size); height: var(--crop-size);
    border-radius: 16px; background: #2b2140;
    touch-action: none; cursor: grab; display: block;
  }
  .crop-canvas.dragging { cursor: grabbing; }
  .zoom-row { display: flex; align-items: center; gap: 10px; width: 100%; }
  .zoom-row input { flex: 1; accent-color: var(--green); }
  .peek-backdrop {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(43, 33, 64, 0.6);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .peek-card {
    background: #fff; border-radius: 24px; padding: 24px;
    width: min(100%, 380px); text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: pop-in 0.3s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .peek-card .label { color: var(--muted); margin: 0; }
  .peek-card .who { font-size: 1.8rem; font-weight: bold; margin: 0; overflow-wrap: anywhere; }
  .peek-card .elf { cursor: default; }
  .peek-card .elf-name { display: none; }
  .peek-stage { height: 210px; display: flex; align-items: center; justify-content: center; }
  .gift { position: relative; width: 120px; height: 96px; margin-top: 40px; }
  .gift .box {
    position: absolute; inset: 0; background: var(--red); border-radius: 10px;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,0.12);
  }
  .gift .box::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 18px;
    transform: translateX(-50%); background: #f5c542;
  }
  .gift .lid {
    position: absolute; left: -8px; right: -8px; top: -22px; height: 26px;
    background: #e85b5b; border-radius: 8px;
    transition: transform 0.45s cubic-bezier(0.3, 1.4, 0.5, 1), opacity 0.45s;
  }
  .gift .lid::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 18px;
    transform: translateX(-50%); background: #f5c542;
  }
  .gift .lid::after {
    content: "🎀"; position: absolute; left: 50%; top: -30px; transform: translateX(-50%); font-size: 38px;
  }
  .gift.shake { animation: gift-shake 0.5s ease-in-out infinite; }
  .gift.open .lid { transform: translate(40px, -90px) rotate(35deg); opacity: 0; }
  .gift.open .box { animation: box-out 0.35s ease-in forwards; }
  @keyframes gift-shake {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-8deg) translateY(-2px); }
    40% { transform: rotate(7deg); }
    60% { transform: rotate(-5deg) translateY(-3px); }
    80% { transform: rotate(4deg); }
  }
  @keyframes box-out { to { transform: scale(0.4); opacity: 0; } }
  @keyframes pop-in { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .reveal { animation: pop-in 0.45s cubic-bezier(0.2, 1.6, 0.4, 1); display: flex; flex-direction: column; align-items: center; }
  @media (prefers-reduced-motion: reduce) { .gift.shake { animation: none; } }
  details.all-matches summary { cursor: pointer; color: var(--muted); }
  details.all-matches .pairs { margin-top: 8px; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 10;
    max-width: calc(100% - 32px);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--red-dark); }
</style>
</head>
<body>
  <header>
    <h1><span class="a">Gift</span> <span class="b">Exchange</span> 🎁</h1>
    <p id="subtitle"></p>
  </header>
  <main id="app"><p class="empty">Loading…</p></main>
  <div id="toast" role="status"></div>
  <canvas id="confetti"></canvas>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, collection, onSnapshot, getDoc, setDoc, updateDoc, deleteDoc,
  serverTimestamp, writeBatch,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CARD_COLORS = ["#d94848", "#2f9e62", "#3aa0ff", "#e8a21a", "#8b6cff", "#e0679a", "#17a2a2", "#f07a3a"];
const MAX_ITEMS = 20;
const GROUPS_KEY = "gifts.groups";
const MIN_PASSWORD = 8;
const PHOTO_SIZE = 160;
// Keep in sync with the photo size limit in firestore.rules.
const MAX_PHOTO_CHARS = 100000;
const PASS_WORDS = [
  "jolly", "cozy", "merry", "snowy", "sparkly", "frosty", "happy", "sleepy", "giggly", "toasty",
  "pinecone", "reindeer", "cocoa", "mitten", "snowman", "cookie", "candle", "sleigh", "penguin", "pajama",
  "ribbon", "lantern", "muffin", "walrus", "blanket", "cupcake", "otter", "teapot", "pretzel", "acorn",
];

const app = document.getElementById("app");
const subtitle = document.getElementById("subtitle");
const toastEl = document.getElementById("toast");

const params = new URLSearchParams(location.search);
const gid = params.get("g");
const adminParam = params.get("admin");
// Keep the organizer key out of the address bar so it doesn't get copied or screen-shared by accident.
if (gid && adminParam) history.replaceState(null, "", `${location.pathname}?g=${encodeURIComponent(gid)}`);

const state = {
  user: null,
  group: undefined,
  people: [],
  editingId: null,
  loadError: null,
  isOrganizer: false,
  access: "checking", // "checking" | "locked" | "member"
};

function loadStore(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; }
}
function saveStore(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
function rememberGroup(id, patch) {
  const all = loadStore(GROUPS_KEY);
  all[id] = { ...all[id], ...patch };
  saveStore(GROUPS_KEY, all);
}

// ---------- tiny DOM helper ----------
function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

let toastTimer;
function toast(msg, isError = false) {
  toastEl.textContent = msg;
  toastEl.classList.toggle("error", isError);
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3500);
}

function friendlyError(err) {
  console.error(err);
  if (err?.code === "permission-denied") return "Sorry, you're not allowed to do that.";
  return "Something went wrong. Please try again.";
}

function randomId(len = 20) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  const bytes = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(bytes, b => chars[b % chars.length]).join("");
}

function safeUrl(raw) {
  const s = raw.trim();
  if (!s) return "";
  try {
    const u = new URL(/^https?:\/\//i.test(s) ? s : "https://" + s);
    return u.protocol === "https:" || u.protocol === "http:" ? u.href : null;
  } catch {
    return null;
  }
}

const norm = s => (s || "").trim().toLowerCase();
// Passwords are case-insensitive so nobody gets tripped up by autocapitalizing phones.
const normPassword = norm;

function randomPassword() {
  const [a, b, c] = crypto.getRandomValues(new Uint32Array(3));
  return `${PASS_WORDS[a % PASS_WORDS.length]}-${PASS_WORDS[b % PASS_WORDS.length]}-${10 + (c % 90)}`;
}
const shareLink = () => `${location.origin}${location.pathname}?g=${encodeURIComponent(gid)}`;
const organizerLink = key => `${shareLink()}&admin=${encodeURIComponent(key)}`;

async function copyText(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
    toast(msg);
  } catch {
    prompt("Copy this:", text);
  }
}

// ---------- setup check ----------
if (firebaseConfig.apiKey.startsWith("YOUR_")) {
  app.replaceChildren(h("div", { class: "panel" },
    h("h2", {}, "Almost there!"),
    h("p", {}, "Firebase isn't connected yet. Follow SETUP.md, then paste your project's config into firebase-config.js."),
  ));
  throw new Error("Firebase config missing");
}

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

onAuthStateChanged(auth, async user => {
  if (!user) {
    signInAnonymously(auth).catch(err => toast(friendlyError(err), true));
    return;
  }
  state.user = user;
  if (gid) {
    await claimOrganizer();
    if (state.isOrganizer || await isMember()) {
      state.access = "member";
      startListening();
    } else {
      state.access = "locked";
    }
  }
  render();
});

let listening = false;
function startListening() {
  if (listening) return;
  listening = true;
  onSnapshot(doc(db, "groups", gid),
    snap => {
      state.group = snap.exists() ? snap.data() : null;
      if (state.group) rememberGroup(gid, { name: state.group.name });
      render();
    },
    err => { state.loadError = friendlyError(err); render(); });
  onSnapshot(collection(db, "groups", gid, "people"),
    snap => {
      state.people = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
      render();
    },
    err => { state.loadError = friendlyError(err); render(); });
}

async function claimOrganizer() {
  const ref = doc(db, "groups", gid, "organizers", state.user.uid);
  try {
    if ((await getDoc(ref)).exists()) {
      state.isOrganizer = true;
      return;
    }
    if (!adminParam) return;
    await setDoc(ref, { key: adminParam });
    state.isOrganizer = true;
    rememberGroup(gid, { adminKey: adminParam });
    toast("You're an organizer on this device. 🎉");
  } catch (err) {
    if (adminParam) toast("That organizer link didn't work.", true);
  }
}

async function isMember() {
  try {
    return (await getDoc(doc(db, "groups", gid, "members", state.user.uid))).exists();
  } catch {
    return false;
  }
}

async function unlock(password) {
  try {
    await setDoc(doc(db, "groups", gid, "members", state.user.uid), { key: normPassword(password) });
  } catch (err) {
    toast("That password didn't work. Check the link and password from your invite.", true);
    return false;
  }
  state.access = "member";
  startListening();
  render();
  toast("Unlocked! 🎁");
  return true;
}

// ---------- permissions (mirrors firestore.rules) ----------
const canEdit = () => state.access === "member";

// ---------- drawing names ----------
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function householdKey(p) {
  return norm(p.household) || "solo:" + p.id;
}

// Fixed matches whose people both still exist.
function activeFixed() {
  const ids = new Set(state.people.map(p => p.id));
  return Object.fromEntries(Object.entries(state.group?.fixed || {}).filter(([g, r]) => ids.has(g) && ids.has(r)));
}

// Without fixed matches, a valid draw exists exactly when no household holds
// more than half the people. With them, drawNames' search is the only check.
function drawProblem(people, avoid, fixed) {
  if (people.length < 2) return "You need at least 2 people to draw names.";
  if (!avoid || Object.keys(fixed).length) return null;
  const counts = {};
  for (const p of people) counts[householdKey(p)] = (counts[householdKey(p)] || 0) + 1;
  const [key, biggest] = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  if (biggest > people.length / 2) {
    const name = people.find(p => householdKey(p) === key).household;
    return `The "${name}" family has too many people for everyone to get someone outside their own family. Add more people or turn off the family rule.`;
  }
  return null;
}

// Fixed matches are placed first and override the family rule.
function drawNames(people, avoid, fixed = {}) {
  const fam = Object.fromEntries(people.map(p => [p.id, householdKey(p)]));
  const ids = people.map(p => p.id);
  const ok = (g, r) => g !== r && !(avoid && fam[g] === fam[r]);
  const taken = new Set(Object.values(fixed));
  const result = { ...fixed };
  // Big families are the hardest to place, so handle their givers first and
  // try their members as receivers first; random order within a family size.
  const famSize = {};
  for (const id of ids) famSize[fam[id]] = (famSize[fam[id]] || 0) + 1;
  const bySize = list => shuffle(list).sort((x, y) => famSize[fam[y]] - famSize[fam[x]]);
  const givers = bySize(ids.filter(id => !(id in fixed)));
  let budget = 200000;
  function place(i) {
    if (i === givers.length) return true;
    if (--budget < 0) return false;
    const g = givers[i];
    for (const r of avoid ? bySize(ids.slice()) : shuffle(ids.slice())) {
      if (taken.has(r) || !ok(g, r)) continue;
      taken.add(r);
      result[g] = r;
      if (place(i + 1)) return true;
      taken.delete(r);
    }
    delete result[g];
    return false;
  }
  return place(0) ? result : null;
}

function drawIsStale() {
  const a = state.group?.assignments;
  if (!a) return false;
  const ids = new Set(state.people.map(p => p.id));
  const keys = Object.keys(a);
  return keys.length !== ids.size || keys.some(k => !ids.has(k) || !ids.has(a[k]));
}

// ---------- actions ----------
async function createGroup(name, password) {
  const id = randomId();
  const key = randomId(32);
  const pw = normPassword(password);
  const batch = writeBatch(db);
  batch.set(doc(db, "groups", id), {
    name,
    avoidSameHousehold: true,
    showMatches: false,
    assignments: null,
    drawnAt: null,
    createdAt: serverTimestamp(),
  });
  batch.set(doc(db, "groups", id, "secret", "admin"), { key });
  batch.set(doc(db, "groups", id, "secret", "family"), { key: pw });
  batch.set(doc(db, "groups", id, "organizers", state.user.uid), { key });
  batch.set(doc(db, "groups", id, "members", state.user.uid), { key: pw });
  try {
    await batch.commit();
    rememberGroup(id, { name, adminKey: key });
    location.href = `${location.pathname}?g=${id}`;
  } catch (err) {
    toast(friendlyError(err), true);
    return false;
  }
  return true;
}

async function savePerson(id, data) {
  const payload = { ...data, updatedAt: serverTimestamp() };
  if (id) return updateDoc(doc(db, "groups", gid, "people", id), payload);
  await setDoc(doc(collection(db, "groups", gid, "people")), { ...payload, createdAt: serverTimestamp() });
}

async function familyPassword() {
  try {
    return (await getDoc(doc(db, "groups", gid, "secret", "family"))).data()?.key || null;
  } catch {
    return null;
  }
}

async function changePassword() {
  const next = prompt(`New family password (at least ${MIN_PASSWORD} characters). Devices that already unlocked stay unlocked.`, randomPassword());
  if (next == null) return;
  if (normPassword(next).length < MIN_PASSWORD) return toast(`Passwords need at least ${MIN_PASSWORD} characters.`, true);
  try {
    await setDoc(doc(db, "groups", gid, "secret", "family"), { key: normPassword(next) });
    toast("Password changed.");
    render();
  } catch (err) {
    toast(friendlyError(err), true);
  }
}

async function organizerKey() {
  const local = loadStore(GROUPS_KEY)[gid]?.adminKey;
  if (local) return local;
  try {
    const snap = await getDoc(doc(db, "groups", gid, "secret", "admin"));
    const key = snap.data()?.key;
    if (key) rememberGroup(gid, { adminKey: key });
    return key || null;
  } catch {
    return null;
  }
}

async function removePerson(p) {
  if (!confirm(`Remove ${p.name} and their wishlist?`)) return;
  try {
    await deleteDoc(doc(db, "groups", gid, "people", p.id));
    toast(`Removed ${p.name}.`);
  } catch (err) {
    toast(friendlyError(err), true);
  }
}

async function updateGroup(fields) {
  try {
    await updateDoc(doc(db, "groups", gid), fields);
  } catch (err) {
    toast(friendlyError(err), true);
  }
}

async function doDraw() {
  const avoid = state.group.avoidSameHousehold;
  const fixed = activeFixed();
  const problem = drawProblem(state.people, avoid, fixed);
  if (problem) return toast(problem, true);
  if (state.group.assignments && !confirm("Names were already drawn. Draw again? Everyone's match will change.")) return;
  const assignments = drawNames(state.people, avoid, fixed);
  if (!assignments) return toast("Couldn't find a valid draw with these rules. Try removing a fixed match or turning off the family rule.", true);
  await updateGroup({ assignments, drawnAt: serverTimestamp() });
  toast("Names drawn! 🎉");
}

async function addFixed(giver, receiver) {
  const fixed = activeFixed();
  if (!giver || !receiver) return toast("Pick both people first.", true);
  if (giver === receiver) return toast("Someone can't buy for themselves.", true);
  if (giver in fixed) return toast("That person already has a fixed match.", true);
  if (Object.values(fixed).includes(receiver)) return toast("Someone is already set to buy for that person.", true);
  await updateGroup({ fixed: { ...fixed, [giver]: receiver } });
}

async function removeFixed(giver) {
  const fixed = activeFixed();
  delete fixed[giver];
  await updateGroup({ fixed });
}

async function clearDraw() {
  if (!confirm("Clear the draw? Everyone's match will be removed.")) return;
  await updateGroup({ assignments: null, drawnAt: null });
}

function personColor(p) {
  let hash = 0;
  for (const ch of p.id) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return CARD_COLORS[hash % CARD_COLORS.length];
}

function isPhoto(s) {
  return typeof s === "string" && /^data:image\/(jpeg|webp);base64,/.test(s);
}

function avatar(p, small = false) {
  const style = `--card-color:${personColor(p)}`;
  const cls = "avatar" + (small ? " small" : "");
  if (isPhoto(p.photo)) return h("img", { class: cls, src: p.photo, alt: "", style });
  return h("span", { class: cls, style, "aria-hidden": "true" }, (p.name || "?").trim().charAt(0).toUpperCase());
}

// Center-crops to a square and shrinks it so it fits comfortably in a Firestore document.
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const el = new Image();
    el.onload = () => { URL.revokeObjectURL(url); resolve(el); };
    el.onerror = () => { URL.revokeObjectURL(url); reject(new Error("unreadable image")); };
    el.src = url;
  });
}

// Shrinks the chosen square of the image so it fits comfortably in a Firestore document.
function exportPhoto(img, sx, sy, side) {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = PHOTO_SIZE;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, sx, sy, side, side, 0, 0, PHOTO_SIZE, PHOTO_SIZE);
  for (const q of [0.82, 0.7, 0.55, 0.4]) {
    const data = canvas.toDataURL("image/jpeg", q);
    if (data.length <= MAX_PHOTO_CHARS) return data;
  }
  throw new Error("image too large");
}

// Opens a crop window; resolves with the cropped photo, or null if cancelled.
function cropPhoto(img) {
  return new Promise(resolve => {
    const V = Math.min(300, innerWidth - 80);
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const minScale = Math.max(V / iw, V / ih);
    const MAX_ZOOM = 5;
    let scale = minScale;
    let ox = (V - iw * scale) / 2, oy = (V - ih * scale) / 2;

    const dpr = devicePixelRatio || 1;
    const canvas = h("canvas", { class: "crop-canvas", style: `--crop-size:${V}px`, "aria-label": "Drag to move your photo" });
    canvas.width = canvas.height = Math.round(V * dpr);
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    const clamp = () => {
      ox = Math.min(0, Math.max(V - iw * scale, ox));
      oy = Math.min(0, Math.max(V - ih * scale, oy));
    };
    function draw() {
      ctx.clearRect(0, 0, V, V);
      ctx.drawImage(img, ox, oy, iw * scale, ih * scale);
      ctx.save();
      ctx.fillStyle = "rgba(20, 14, 36, 0.55)";
      ctx.beginPath();
      ctx.rect(0, 0, V, V);
      ctx.arc(V / 2, V / 2, V / 2 - 4, 0, Math.PI * 2);
      ctx.fill("evenodd");
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(V / 2, V / 2, V / 2 - 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    function zoomTo(next, cx = V / 2, cy = V / 2) {
      next = Math.min(minScale * MAX_ZOOM, Math.max(minScale, next));
      ox = cx - (cx - ox) * (next / scale);
      oy = cy - (cy - oy) * (next / scale);
      scale = next;
      clamp();
      slider.value = String(scale / minScale);
      draw();
    }

    const slider = h("input", {
      type: "range", min: "1", max: String(MAX_ZOOM), step: "0.01", value: "1", "aria-label": "Zoom",
      oninput: () => zoomTo(minScale * Number(slider.value)),
    });

    // Pointer tracking handles both one-finger/mouse drags and two-finger pinches.
    const pointers = new Map();
    let pinch = null;
    const local = e => {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };
    canvas.addEventListener("pointerdown", e => {
      canvas.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, local(e));
      canvas.classList.add("dragging");
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), scale };
      }
    });
    canvas.addEventListener("pointermove", e => {
      if (!pointers.has(e.pointerId)) return;
      const prev = pointers.get(e.pointerId);
      const cur = local(e);
      pointers.set(e.pointerId, cur);
      if (pointers.size === 2 && pinch) {
        const [a, b] = [...pointers.values()];
        zoomTo(pinch.scale * Math.hypot(a.x - b.x, a.y - b.y) / pinch.dist, (a.x + b.x) / 2, (a.y + b.y) / 2);
      } else if (pointers.size === 1) {
        ox += cur.x - prev.x;
        oy += cur.y - prev.y;
        clamp();
        draw();
      }
    });
    const release = e => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (!pointers.size) canvas.classList.remove("dragging");
    };
    canvas.addEventListener("pointerup", release);
    canvas.addEventListener("pointercancel", release);
    canvas.addEventListener("wheel", e => {
      e.preventDefault();
      const p = local(e);
      zoomTo(scale * Math.exp(-e.deltaY * 0.0015), p.x, p.y);
    }, { passive: false });

    function finish(result) {
      document.removeEventListener("keydown", onKey);
      backdrop.remove();
      resolve(result);
    }
    const onKey = e => { if (e.key === "Escape") finish(null); };
    document.addEventListener("keydown", onKey);

    const useBtn = h("button", {
      class: "btn",
      onclick: () => {
        try {
          finish(exportPhoto(img, -ox / scale, -oy / scale, V / scale));
        } catch {
          toast("Couldn't use that picture. Try a different one.", true);
        }
      },
    }, "✅ Use this photo");
    const card = h("div", { class: "peek-card crop-card", role: "dialog", "aria-modal": "true", "aria-label": "Crop your photo" },
      h("h2", { style: "margin:0" }, "Line up your face"),
      h("p", { class: "label" }, "Drag to move. Zoom with the slider (or pinch / scroll)."),
      canvas,
      h("div", { class: "zoom-row" }, "➖", slider, "➕"),
      h("div", { class: "row", style: "justify-content:center" },
        useBtn,
        h("button", { class: "btn secondary", onclick: () => finish(null) }, "Cancel"),
      ),
    );
    const backdrop = h("div", { class: "peek-backdrop", onclick: e => { if (e.target === backdrop) finish(null); } }, card);
    document.body.append(backdrop);
    draw();
    useBtn.focus();
  });
}

// Outfits follow each person's position in the (name-sorted) list, so someone
// wears the same outfit in the crew and in the peek reveal.
function makeElf(p, props, idPrefix = "elf") {
  const i = Math.max(0, state.people.findIndex(q => q.id === p.id));
  const el = h(props.onclick ? "button" : "div", { class: "elf", type: props.onclick ? "button" : null, ...props });
  el.innerHTML = elfSvg(ELF_OUTFITS[i % ELF_OUTFITS.length], i, idPrefix);
  el.querySelector(".dancer").style.animationDelay = `${-(i * 0.23) % 1.6}s`;
  el.querySelector(".face-bg").setAttribute("fill", personColor(p));
  if (isPhoto(p.photo)) el.querySelector(".face-photo").setAttribute("href", p.photo);
  else el.querySelector(".face-initial").textContent = (p.name || "?").trim().charAt(0).toUpperCase();
  el.append(h("span", { class: "elf-name" }, p.name));
  return el;
}

let peekTimers = [];
function closePeek() {
  peekTimers.forEach(clearTimeout);
  peekTimers = [];
  document.querySelector(".peek-backdrop")?.remove();
  document.removeEventListener("keydown", peekKeydown);
}
function peekKeydown(e) {
  if (e.key === "Escape") closePeek();
}

function openPeek(giverId) {
  closePeek();
  const byId = Object.fromEntries(state.people.map(p => [p.id, p]));
  const giver = byId[giverId];
  const target = byId[state.group.assignments[giverId]];
  if (!giver || !target) return toast("Couldn't find that match. Ask the organizer to draw again.", true);

  const stage = h("div", { class: "peek-stage" });
  const gift = h("div", { class: "gift shake", "aria-hidden": "true" }, h("div", { class: "box" }), h("div", { class: "lid" }));
  stage.append(gift);
  const label = h("p", { class: "label" }, `Shh, ${giver.name}… unwrapping your match…`);
  const who = h("p", { class: "who" });
  const actions = h("div", { class: "row", style: "justify-content:center", hidden: true },
    h("button", { class: "btn", onclick: () => { closePeek(); jumpTo(target.id); } }, "🎁 See their wishlist"),
    h("button", { class: "btn secondary", onclick: closePeek }, "Hide"),
  );
  const card = h("div", { class: "peek-card", role: "dialog", "aria-modal": "true", "aria-live": "polite" }, label, stage, who, actions);
  const backdrop = h("div", { class: "peek-backdrop", onclick: e => { if (e.target === backdrop) closePeek(); } }, card);
  document.body.append(backdrop);
  document.addEventListener("keydown", peekKeydown);

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  peekTimers.push(setTimeout(() => gift.classList.replace("shake", "open"), reduced ? 0 : 1400));
  peekTimers.push(setTimeout(() => {
    stage.replaceChildren(h("div", { class: "reveal" }, makeElf(target, {}, "peek")));
    label.textContent = `${giver.name}, you're buying for…`;
    who.textContent = `${target.name}! 🎉`;
    who.style.color = personColor(target);
    actions.hidden = false;
    if (!reduced) launchConfetti();
  }, reduced ? 50 : 1800));
}

// ---------- confetti ----------
const confettiCanvas = document.getElementById("confetti");
const cctx = confettiCanvas.getContext("2d");
let confettiPieces = [];
let confettiRunning = false;

function launchConfetti() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, hgt = innerHeight;
  confettiCanvas.width = w * dpr;
  confettiCanvas.height = hgt * dpr;
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (let i = 0; i < 160; i++) {
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.8;
    const speed = 8 + Math.random() * 12;
    confettiPieces.push({
      x: w / 2, y: hgt * 0.45,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      w: 6 + Math.random() * 6, h: 10 + Math.random() * 8,
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.4,
      color: CARD_COLORS[Math.floor(Math.random() * CARD_COLORS.length)],
      life: 0,
    });
  }
  if (!confettiRunning) {
    confettiRunning = true;
    requestAnimationFrame(confettiFrame);
  }
}

function confettiFrame() {
  const w = innerWidth, hgt = innerHeight;
  cctx.clearRect(0, 0, w, hgt);
  for (const p of confettiPieces) {
    p.vy += 0.35; p.vx *= 0.985; p.vy *= 0.985;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    cctx.scale(1, Math.cos(p.life * 0.15));
    cctx.fillStyle = p.color;
    cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cctx.restore();
  }
  confettiPieces = confettiPieces.filter(p => p.y < hgt + 40);
  if (confettiPieces.length) requestAnimationFrame(confettiFrame);
  else { confettiRunning = false; cctx.clearRect(0, 0, w, hgt); }
}

function jumpTo(id) {
  const el = document.getElementById("p-" + id);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
}

// ---------- views ----------
// resetForm rebuilds the add/edit form; otherwise live updates keep a form that
// has focus or unsaved changes (e.g. while the photo crop window is open).
function render(resetForm = false) {
  const form = document.getElementById("personForm");
  const active = document.activeElement;
  const typing = !resetForm && form && (form.contains(active) || form.dataset.dirty === "1");

  if (!gid) return renderLanding();
  if (state.access === "checking") return;
  if (state.access === "locked") return renderLocked();
  if (state.loadError) return app.replaceChildren(h("div", { class: "banner error" }, state.loadError));
  if (state.group === undefined) return;
  if (state.group === null) {
    subtitle.textContent = "";
    return app.replaceChildren(h("div", { class: "panel center" },
      h("h2", {}, "Exchange not found"),
      h("p", { class: "hint" }, "Double-check the link the organizer sent you."),
    ));
  }

  subtitle.textContent = state.group.name;
  document.title = `${state.group.name} · Gift Exchange`;

  const sections = [];
  if (state.isOrganizer) sections.push(organizerView());
  else sections.push(shareView());
  if (drawReady()) sections.push(peekView());
  if (drawReady() && matchesPublic()) sections.push(pairsView());
  if (state.people.length) sections.push(elfView());

  if (typing) {
    for (const el of [...app.children]) if (el.id !== "personFormPanel") el.remove();
    const formPanel = document.getElementById("personFormPanel");
    app.prepend(...sections);
    formPanel.after(peopleView());
    return;
  }
  app.replaceChildren(...sections, personFormView(), peopleView());
}

function renderLocked() {
  subtitle.textContent = "";
  const pwInput = h("input", {
    type: "text", placeholder: "Family password", required: true,
    autocomplete: "off", autocapitalize: "none", spellcheck: false,
  });
  const btn = h("button", { class: "btn", type: "submit" }, "🔓 Unlock");
  app.replaceChildren(h("div", { class: "panel center" },
    h("h2", {}, "🔒 This gift exchange is locked"),
    h("p", { class: "hint" }, "Enter the family password from your invite. You only need to do this once on each device."),
    h("form", {
      class: "row",
      style: "justify-content:center",
      onsubmit: async e => {
        e.preventDefault();
        if (!pwInput.value.trim()) return;
        btn.disabled = true;
        if (!await unlock(pwInput.value)) btn.disabled = false;
      },
    }, pwInput, btn),
  ));
  pwInput.focus();
}

function renderLanding() {
  subtitle.textContent = "";
  const nameInput = h("input", { type: "text", maxLength: 60, placeholder: "e.g. Family Christmas 2026", required: true });
  const pwInput = h("input", { type: "text", maxLength: 60, required: true, value: randomPassword(), autocomplete: "off", spellcheck: false });
  const createBtn = h("button", { class: "btn", type: "submit", disabled: !state.user }, "Create");
  const createForm = h("form", {
    style: "display:flex;flex-direction:column;gap:12px",
    onsubmit: async e => {
      e.preventDefault();
      const n = nameInput.value.trim();
      const pw = pwInput.value.trim();
      if (!n || !state.user) return;
      if (pw.length < MIN_PASSWORD) return toast(`Passwords need at least ${MIN_PASSWORD} characters.`, true);
      createBtn.disabled = true;
      if (!await createGroup(n, pw)) createBtn.disabled = false;
    },
  },
    h("label", { class: "field" }, "Name", nameInput),
    h("label", { class: "field" },
      h("span", {}, "Family password ", h("span", { class: "opt" }, "(we made one up, change it if you like)")),
      pwInput),
    h("div", { class: "row" }, createBtn),
  );

  const mine = Object.entries(loadStore(GROUPS_KEY));
  app.replaceChildren(
    h("div", { class: "panel" },
      h("h2", {}, "Start a new gift exchange"),
      h("p", { class: "hint" }, "You'll get a link and password to send the family, plus a private organizer link for you."),
      createForm),
    mine.length && h("div", { class: "panel" },
      h("h2", {}, "Exchanges on this device"),
      h("ul", { class: "groups" }, mine.map(([id, g]) =>
        h("li", {}, h("a", { href: `?g=${encodeURIComponent(id)}` }, g.name || "Untitled exchange"))))),
    h("p", { class: "hint center" }, "Got a link from the organizer? Just open it."),
  );
}

function shareView() {
  const link = shareLink();
  return h("div", { class: "panel" },
    h("h2", {}, "Invite family"),
    h("p", { class: "hint" }, "Send this link. They'll also need the family password."),
    h("div", { class: "share" },
      h("code", {}, link),
      h("button", { class: "btn secondary", onclick: () => copyText(link, "Link copied!") }, "📋 Copy link"),
    ),
  );
}

function inviteMessage(password) {
  return `You're invited to our gift exchange: ${state.group.name}! 🎁\n\n` +
    `1. Open ${shareLink()}\n` +
    `2. Enter the family password: ${password}\n` +
    `3. Add yourself (and your kids) with a wishlist.\n\n` +
    `Everyone in the family can see and edit the wishlists.`;
}

function organizerView() {
  const g = state.group;
  const drawn = !!g.assignments;
  const stale = drawIsStale();
  const pwCode = h("code", {}, "••••••••");
  familyPassword().then(pw => { if (pw) pwCode.textContent = pw; });
  return h("div", { class: "panel" },
    h("h2", {}, "Organizer tools"),
    h("div", { class: "field" }, "Invite the family"),
    h("div", { class: "share" },
      h("code", {}, shareLink()),
      h("button", { class: "btn secondary", onclick: () => copyText(shareLink(), "Link copied!") }, "📋 Link"),
    ),
    h("div", { class: "share" },
      pwCode,
      h("button", { class: "btn secondary", onclick: changePassword }, "Change"),
    ),
    h("div", { class: "row" },
      h("button", {
        class: "btn",
        onclick: async () => {
          const pw = await familyPassword();
          if (!pw) return toast("Couldn't load the password.", true);
          copyText(inviteMessage(pw), "Invite copied! Paste it into an email or text.");
        },
      }, "✉️ Copy invite message"),
    ),
    h("div", { class: "field" }, "Drawing names"),
    h("label", { class: "row" },
      h("input", {
        type: "checkbox",
        checked: g.avoidSameHousehold,
        onchange: e => updateGroup({ avoidSameHousehold: e.target.checked }),
      }),
      "Don't match people from the same family",
    ),
    h("label", { class: "row" },
      h("input", {
        type: "checkbox",
        checked: matchesPublic(),
        onchange: e => updateGroup({ showMatches: e.target.checked }),
      }),
      "Show everyone's matches on the page",
    ),
    !matchesPublic() && h("p", { class: "hint" }, "Matches are hidden. Everyone can still peek at their own match."),
    fixedMatchesView(),
    stale && h("div", { class: "banner" }, "People were added or removed since names were drawn. Draw again to include everyone."),
    drawReady() && !matchesPublic() && h("details", { class: "all-matches" },
      h("summary", {}, "🙈 Show all matches (organizer only)"),
      pairsList()),
    h("div", { class: "row" },
      h("button", { class: "btn red", onclick: doDraw, disabled: state.people.length < 2 },
        drawn ? "🎲 Draw names again" : "🎲 Draw names"),
      drawn && h("button", { class: "btn secondary", onclick: clearDraw }, "Clear draw"),
    ),
    h("p", { class: "hint" }, `${state.people.length} ${state.people.length === 1 ? "person has" : "people have"} joined.`),
    h("div", { class: "row" },
      h("button", {
        class: "btn secondary small",
        onclick: async () => {
          const key = await organizerKey();
          if (!key) return toast("Couldn't load the organizer link.", true);
          copyText(organizerLink(key), "Organizer link copied. Keep it private!");
        },
      }, "🔑 Copy my organizer link"),
    ),
    h("p", { class: "hint" }, "Open your organizer link on another device to manage this exchange there. Anyone with it can draw names, so keep it to yourself."),
  );
}

function fixedMatchesView() {
  const byId = Object.fromEntries(state.people.map(p => [p.id, p]));
  const fixed = activeFixed();
  const giverSel = h("select", { "aria-label": "Giver" },
    h("option", { value: "" }, "Pick a giver…"),
    state.people.filter(p => !(p.id in fixed)).map(p => h("option", { value: p.id }, p.name)));
  const receiverSel = h("select", { "aria-label": "Receiver" },
    h("option", { value: "" }, "Pick who they buy for…"),
    state.people.filter(p => !Object.values(fixed).includes(p.id)).map(p => h("option", { value: p.id }, p.name)));
  return h("div", { style: "display:flex;flex-direction:column;gap:8px" },
    h("div", { class: "field" }, "Fixed matches"),
    h("p", { class: "hint" }, "Make sure certain people buy for certain people. Everyone else is drawn at random. Fixed matches ignore the family rule."),
    Object.keys(fixed).length > 0 && h("ul", { class: "fixed-list" }, Object.entries(fixed).map(([g, r]) =>
      h("li", {},
        avatar(byId[g], true), h("span", {}, h("strong", {}, byId[g].name), " always buys for ", h("strong", {}, byId[r].name)),
        h("button", { class: "icon-btn", title: "Remove", "aria-label": `Remove fixed match for ${byId[g].name}`, onclick: () => removeFixed(g) }, "×")))),
    state.people.length >= 2 && h("div", { class: "row" },
      giverSel, receiverSel,
      h("button", { class: "btn secondary small", onclick: () => addFixed(giverSel.value, receiverSel.value) }, "+ Add"),
    ),
  );
}

function pairsView() {
  return h("div", { class: "panel" },
    h("h2", {}, "Who's buying for whom"),
    pairsList(),
  );
}

function pairsList() {
  const byId = Object.fromEntries(state.people.map(p => [p.id, p]));
  const a = state.group.assignments;
  return h("ul", { class: "pairs" }, state.people.map(p =>
      h("li", {}, avatar(p, true), h("strong", {}, p.name), " → ", avatar(byId[a[p.id]], true),
        h("a", { href: "#p-" + a[p.id], onclick: e => { e.preventDefault(); jumpTo(a[p.id]); } }, byId[a[p.id]].name)),
  ));
}

function itemRow(item = { text: "", url: "" }) {
  const row = h("div", { class: "item-row" },
    h("input", { type: "text", maxLength: 120, placeholder: "new socks, a box of oranges, etc", value: item.text, "data-role": "text" }),
    h("input", { type: "url", maxLength: 500, placeholder: "Link (optional)", value: item.url || "", "data-role": "url" }),
    h("button", { type: "button", class: "icon-btn", title: "Remove item", "aria-label": "Remove item", onclick: () => row.remove() }, "×"),
  );
  return row;
}

function personFormView() {
  const editing = state.editingId ? state.people.find(p => p.id === state.editingId) : null;
  const households = [...new Set(state.people.map(p => p.household.trim()).filter(Boolean))].sort();

  const nameInput = h("input", { type: "text", maxLength: 50, required: true, placeholder: "e.g. Grandma Jo", value: editing?.name || "" });
  const famInput = h("input", { type: "text", maxLength: 40, list: "households", placeholder: "e.g. Smiths", value: editing?.household || "" });
  const itemsEl = h("div", { class: "items-editor" });
  const startItems = editing?.items?.length ? editing.items : [{}];
  startItems.forEach(i => itemsEl.append(itemRow({ text: i.text || "", url: i.url || "" })));

  let photo = isPhoto(editing?.photo) ? editing.photo : "";
  const preview = h("span", {});
  const removePhotoBtn = h("button", { type: "button", class: "btn secondary small" }, "Remove photo");
  const fileInput = h("input", { type: "file", accept: "image/*" });
  function showPhoto() {
    preview.replaceChildren(avatar({ id: editing?.id || "new", name: nameInput.value || "?", photo }));
    removePhotoBtn.hidden = !photo;
  }
  const markDirty = () => { const f = document.getElementById("personForm"); if (f) f.dataset.dirty = "1"; };
  removePhotoBtn.addEventListener("click", () => { photo = ""; markDirty(); showPhoto(); });
  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    fileInput.value = "";
    if (!file) return;
    markDirty();
    let img;
    try {
      img = await loadImage(file);
    } catch {
      return toast("Couldn't open that picture. Try a JPG or PNG.", true);
    }
    const cropped = await cropPhoto(img);
    if (cropped) {
      photo = cropped;
      markDirty();
      showPhoto();
    }
  });
  nameInput.addEventListener("input", () => { if (!photo) showPhoto(); });
  showPhoto();

  const saveBtn = h("button", { class: "btn", type: "submit" }, editing ? "Save changes" : "Add to the exchange");

  async function onSubmit(e) {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) return toast("Please add a name.", true);
    const items = [];
    for (const row of itemsEl.children) {
      const text = row.querySelector('[data-role="text"]').value.trim();
      const url = safeUrl(row.querySelector('[data-role="url"]').value);
      if (url === null) return toast(`"${row.querySelector('[data-role="url"]').value}" doesn't look like a web link.`, true);
      if (text || url) items.push({ text: text || url, url });
    }
    if (items.length > MAX_ITEMS) return toast(`Please keep it to ${MAX_ITEMS} items or fewer.`, true);
    saveBtn.disabled = true;
    try {
      await savePerson(editing?.id, { name, household: famInput.value.trim(), items, photo });
      toast(editing ? "Saved!" : `${name} has joined! 🎁`);
      state.editingId = null;
      document.activeElement?.blur();
      render(true);
    } catch (err) {
      toast(friendlyError(err), true);
      saveBtn.disabled = false;
    }
  }

  return h("div", { class: "panel", id: "personFormPanel" },
    h("h2", {}, editing ? `Editing ${editing.name}` : "Add yourself (or your kids!)"),
    h("form", { id: "personForm", onsubmit: onSubmit, oninput: markDirty, style: "display:flex;flex-direction:column;gap:12px" },
      h("div", { class: "row" },
        h("label", { class: "field", style: "flex:1;min-width:180px" }, "Name", nameInput),
        h("label", { class: "field", style: "flex:1;min-width:180px" },
          h("span", {}, "Family ", h("span", { class: "opt" }, "(optional, so families don't draw each other)")), famInput),
        h("datalist", { id: "households" }, households.map(f => h("option", { value: f }))),
      ),
      h("div", { class: "field" }, h("span", {}, "Picture ", h("span", { class: "opt" }, "(optional)"))),
      h("div", { class: "photo-picker" },
        preview,
        h("label", { class: "btn secondary small", style: "cursor:pointer" }, "📷 Choose picture", fileInput),
        removePhotoBtn,
      ),
      h("div", { class: "field" }, "Wishlist"),
      itemsEl,
      h("div", { class: "row" },
        h("button", {
          type: "button", class: "btn secondary small",
          onclick: () => {
            if (itemsEl.children.length >= MAX_ITEMS) return toast(`That's the max of ${MAX_ITEMS} items.`, true);
            itemsEl.append(itemRow());
          },
        }, "+ Add another item"),
      ),
      h("div", { class: "row" },
        saveBtn,
        editing && h("button", { type: "button", class: "btn secondary", onclick: () => { state.editingId = null; render(true); } }, "Cancel"),
      ),
    ),
  );
}

function peopleView() {
  if (!state.people.length) {
    return h("div", { class: "panel" }, h("p", { class: "empty" }, "Nobody has joined yet. Be the first!"));
  }
  const byId = Object.fromEntries(state.people.map(p => [p.id, p]));
  const a = drawReady() && matchesPublic() && state.group.assignments;
  return h("section", { class: "people" }, state.people.map(p => {
    const target = a && byId[a[p.id]];
    return h("article", { class: "card", id: "p-" + p.id, style: `--card-color:${personColor(p)}` },
      h("div", { class: "card-head" },
        avatar(p),
        h("h3", {}, p.name, p.household && h("span", { class: "tag" }, p.household))),
      target && h("div", { class: "buying" }, "🎁 Buying for ",
        h("a", { href: "#p-" + target.id, onclick: e => { e.preventDefault(); jumpTo(target.id); } }, target.name)),
      p.items?.length
        ? h("ul", {}, p.items.map(item => {
            const url = item.url && safeUrl(item.url);
            return h("li", {}, url
              ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, item.text || url)
              : item.text);
          }))
        : h("p", { class: "none" }, "No wishes yet."),
      canEdit() && h("div", { class: "actions" },
        h("button", {
          class: "btn secondary small",
          onclick: () => { state.editingId = p.id; render(true); document.getElementById("personFormPanel").scrollIntoView({ behavior: "smooth" }); },
        }, "✏️ Edit"),
        h("button", { class: "btn secondary small", onclick: () => removePerson(p) }, "🗑 Remove"),
      ),
    );
  }));
}

render();
</script>
